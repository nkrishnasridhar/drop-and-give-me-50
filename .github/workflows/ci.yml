name: CI

on:
  push:
    branches: [main]
  pull_request:

# These are placeholders, not real credentials. DATABASE_URL: drizzle-kit
# generate only diffs src/server/db/schema.ts against drizzle/meta
# locally — it never connects — but drizzle.config.ts still requires the
# variable to be present to construct its config object. The AUTH_* vars
# are read by NextAuth() at module load time (src/server/auth/index.ts),
# which happens during `next build`'s page-data collection step even
# though no request is ever made.
env:
  DATABASE_URL: postgres://ci:ci@localhost:5432/ci
  AUTH_SECRET: ci-placeholder-secret-not-for-real-use
  AUTH_GOOGLE_ID: ci-placeholder-google-id
  AUTH_GOOGLE_SECRET: ci-placeholder-google-secret
  VAPID_PUBLIC_KEY: ci-placeholder-vapid-public
  VAPID_PRIVATE_KEY: ci-placeholder-vapid-private
  VAPID_SUBJECT: mailto:ci@example.com
  CRON_SECRET: ci-placeholder-cron-secret

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Check for un-generated migrations
        run: |
          npm run db:generate
          git diff --exit-code -- drizzle || {
            echo "::error::src/server/db/schema.ts changed without regenerating migrations. Run 'npm run db:generate' and commit the result.";
            exit 1;
          }
